logging:
  level:
    root: WARN
    org.aibles.intellihire: INFO

spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rate-limit:
    enabled: true
    default-capacity: 30
    default-refill-tokens: 30
    default-refill-seconds: 60
