spring:
  application:
    name: auth-service

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}
        format_sql: true
    show-sql: false

  # Mail Configuration
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA}
    table: flyway_schema_history_auth
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Application Configuration
application:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS}
      refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS}
      access-token-audience: ${JWT_ACCESS_AUDIENCE}
      refresh-token-audience: ${JWT_REFRESH_AUDIENCE}

    password:
      min-length: ${PASSWORD_MIN_LENGTH}
      require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE}
      require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE}
      require-digit: ${PASSWORD_REQUIRE_DIGIT}
      require-special: ${PASSWORD_REQUIRE_SPECIAL}
      max-failed-attempts: ${PASSWORD_MAX_FAILED_ATTEMPTS}
      lock-duration-minutes: ${PASSWORD_LOCK_DURATION_MINUTES}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    github:
      client-id: ${GITHUB_CLIENT_ID}
      client-secret: ${GITHUB_CLIENT_SECRET}
      redirect-uri: ${GITHUB_REDIRECT_URI}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  email:
    from: ${SMTP_FROM:noreply@intellihire.com}
    base-url: ${APP_BASE_URL:http://localhost:4200}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-capacity: 60
    default-refill-tokens: 60
    default-refill-seconds: 60

# Server Configuration
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    org.aibles.intellihire: INFO
