<div class="reject-dialog">
  <h2 class="dialog-title">Từ chối câu hỏi</h2>

  <p class="dialog-preview">{{ data.questionText | slice:0:120 }}{{ data.questionText.length > 120 ? '...' : '' }}</p>

  <div class="field-group">
    <label class="field-label">Lý do từ chối <span class="required">*</span></label>
    <textarea
      class="field-textarea"
      [(ngModel)]="reason"
      placeholder="Nêu lý do từ chối câu hỏi này..."
      rows="4"
      maxlength="500"
    ></textarea>
    <span class="char-count">{{ reason.length }}/500</span>
  </div>

  <div class="dialog-actions">
    <button class="btn-cancel" (click)="cancel()">Hủy</button>
    <button class="btn-reject" (click)="confirm()" [disabled]="!reason.trim()">
      Từ chối câu hỏi
    </button>
  </div>
</div>
