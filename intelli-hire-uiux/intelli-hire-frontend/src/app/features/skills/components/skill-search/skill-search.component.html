<div class="skill-search-wrapper">
  <mat-form-field appearance="outline" class="skill-search-field">
    <mat-label>{{ label }}</mat-label>
    <input
      matInput
      [formControl]="searchControl"
      [placeholder]="placeholder"
      [matAutocomplete]="skillAuto">

    <button
      *ngIf="searchControl.value"
      matSuffix
      class="clear-btn"
      type="button"
      (click)="clear()"
      title="Clear">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <mat-autocomplete
      #skillAuto="matAutocomplete"
      [displayWith]="displayFn"
      (optionSelected)="onOptionSelected($event.option.value)">

      <mat-option *ngIf="searching" disabled class="searching-option">
        <span class="searching-text">Searching...</span>
      </mat-option>

      <mat-option
        *ngFor="let skill of results"
        [value]="skill"
        class="skill-option">
        <div class="skill-option-content">
          <span class="skill-name">{{ skill.name }}</span>
          <span class="skill-category">{{ skill.category }}</span>
        </div>
      </mat-option>

      <mat-option
        *ngIf="!searching && results.length === 0 && searchControl.value && searchControl.value.length > 0"
        disabled
        class="no-results-option">
        <span class="no-results-text">No skills found</span>
      </mat-option>

    </mat-autocomplete>
  </mat-form-field>
</div>
