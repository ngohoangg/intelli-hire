<div class="page-container">

  <!-- Back -->
  <button class="back-btn" (click)="cancel()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Interviews
  </button>

  <!-- Form Card -->
  <div class="form-card card">
    <div class="form-header">
      <div class="form-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <line x1="9" y1="9" x2="15" y2="9"/>
          <line x1="9" y1="13" x2="13" y2="13"/>
        </svg>
      </div>
      <div>
        <h2>New Interview Session</h2>
        <p class="form-subtitle">Configure your technical interview</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">

      <!-- ── Question Source Selector ─────────────────────────── -->
      <div class="source-selector">
        <span class="field-label">Question Source</span>
        <div class="source-options">

          <button type="button" class="source-option" [class.active]="questionSource === 'bank'" (click)="setSource('bank')">
            <div class="source-option-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M3 5v4c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
                <path d="M3 9v4c0 1.66 4.03 3 9 3s9-1.34 9-3V9"/>
                <path d="M3 13v4c0 1.66 4.03 3 9 3s9-1.34 9-3v-4"/>
              </svg>
            </div>
            <div class="source-option-body">
              <span class="source-option-title">System Bank</span>
              <span class="source-option-desc">Curated questions from our database</span>
            </div>
            <div class="source-check" *ngIf="questionSource === 'bank'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
          </button>

          <button type="button" class="source-option" [class.active]="questionSource === 'resume'" (click)="setSource('resume')">
            <div class="source-option-icon ai">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"/>
                <path d="M9 12h6M9 16h4"/>
              </svg>
            </div>
            <div class="source-option-body">
              <span class="source-option-title">AI Generated</span>
              <span class="source-option-desc">Personalized questions from your resume</span>
            </div>
            <div class="source-check" *ngIf="questionSource === 'resume'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
          </button>

        </div>
      </div>

      <!-- ── Bank Fields ────────────────────────────────────────── -->
      <ng-container *ngIf="questionSource === 'bank'">

        <div class="field-group">
          <label class="field-label" for="ic-topic">Topic</label>
          <div class="input-wrap">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 7h16"/><path d="M7 12h10"/><path d="M10 18h4"/>
              </svg>
            </span>
            <input
              id="ic-topic"
              class="field-input"
              formControlName="topic"
              placeholder="e.g. Java Spring Boot, React, SQL…"
            />
          </div>
          <span class="field-error" *ngIf="form.get('topic')?.touched && form.get('topic')?.hasError('required')">
            Topic is required
          </span>
          <span class="field-error" *ngIf="form.get('topic')?.touched && form.get('topic')?.hasError('maxlength')">
            Max 100 characters
          </span>
        </div>

        <div class="field-group">
          <label class="field-label" for="ic-difficulty">Difficulty</label>
          <div class="input-wrap">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3 4 8l8 5 8-5-8-5Z"/>
                <path d="m4 16 8 5 8-5"/><path d="m4 12 8 5 8-5"/>
              </svg>
            </span>
            <mat-select
              id="ic-difficulty"
              class="field-input field-select"
              formControlName="difficulty"
              panelClass="ih-select-panel">
              <mat-option *ngFor="let d of difficulties" [value]="d.value">{{ d.label }}</mat-option>
            </mat-select>
          </div>
        </div>

      </ng-container>

      <!-- ── Resume Fields ──────────────────────────────────────── -->
      <ng-container *ngIf="questionSource === 'resume'">

        <div class="field-group">
          <label class="field-label" for="ic-resume">Resume</label>
          <div class="input-wrap" [class.disabled]="loadingResumes">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </span>
            <mat-select
              id="ic-resume"
              class="field-input field-select"
              formControlName="resume_id"
              [disabled]="loadingResumes"
              panelClass="ih-select-panel">
              <mat-option *ngIf="loadingResumes" [value]="null" disabled>Loading resumes…</mat-option>
              <mat-option *ngIf="!loadingResumes && resumes.length === 0" [value]="null" disabled>No parsed resumes found</mat-option>
              <mat-option *ngFor="let r of resumes" [value]="r.id">{{ r.title }}</mat-option>
            </mat-select>
          </div>
          <span class="field-hint warn" *ngIf="!loadingResumes && resumes.length === 0">
            Upload and parse a resume first to use AI generation.
          </span>
          <span class="field-error" *ngIf="form.get('resume_id')?.touched && form.get('resume_id')?.hasError('required')">
            Please select a resume
          </span>
        </div>

        <div class="two-col">
          <div class="field-group">
            <label class="field-label" for="ic-qtype">Question Type</label>
            <div class="input-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </span>
              <mat-select
                id="ic-qtype"
                class="field-input field-select"
                formControlName="question_type"
                panelClass="ih-select-panel">
                <mat-option *ngFor="let t of questionTypes" [value]="t.value">{{ t.label }}</mat-option>
              </mat-select>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="ic-lang">Language</label>
            <div class="input-wrap">
              <span class="field-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="2" y1="12" x2="22" y2="12"/>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
              </span>
              <mat-select
                id="ic-lang"
                class="field-input field-select"
                formControlName="language"
                panelClass="ih-select-panel">
                <mat-option *ngFor="let l of languages" [value]="l.value">{{ l.label }}</mat-option>
              </mat-select>
            </div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="ic-level">Difficulty Level</label>
          <div class="input-wrap">
            <span class="field-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3 4 8l8 5 8-5-8-5Z"/>
                <path d="m4 16 8 5 8-5"/><path d="m4 12 8 5 8-5"/>
              </svg>
            </span>
            <mat-select
              id="ic-level"
              class="field-input field-select"
              formControlName="difficulty_name"
              panelClass="ih-select-panel">
              <mat-option *ngFor="let d of difficulties" [value]="d.value">{{ d.label }}</mat-option>
            </mat-select>
          </div>
        </div>

      </ng-container>

      <!-- ── Common: Question Count ─────────────────────────────── -->
      <div class="question-count">
        <label class="field-label">
          Number of Questions: <span class="count-value">{{ form.get('question_count')?.value }}</span>
        </label>
        <mat-slider min="1" max="20" step="1" discrete>
          <input matSliderThumb formControlName="question_count" />
        </mat-slider>
      </div>

      <!-- ── Actions ───────────────────────────────────────────── -->
      <div class="form-actions">
        <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="saving">
          <ng-container *ngIf="!saving">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            Start Interview
          </ng-container>
          <span *ngIf="saving">Creating…</span>
        </button>
      </div>

    </form>
  </div>

</div>

<app-loading-spinner [isLoading]="saving" />
