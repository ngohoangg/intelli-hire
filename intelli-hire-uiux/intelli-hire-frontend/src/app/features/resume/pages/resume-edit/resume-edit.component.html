<div class="page-container">

  <button class="back-btn" (click)="router.navigate(['/resumes', resumeId])">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Detail
  </button>

  <div class="form-card card" *ngIf="!loading">
    <div class="form-header">
      <div class="form-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
      <div>
        <h2>Edit Resume</h2>
        <p class="form-subtitle">Update the resume title</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">
      <mat-form-field appearance="outline" floatLabel="always" class="ih-field full-width">
        <mat-label>Resume Title *</mat-label>
        <input matInput formControlName="title">
        <mat-error *ngIf="title.hasError('required')">Title is required</mat-error>
        <mat-error *ngIf="title.hasError('minlength')">Title must be at least 3 characters</mat-error>
      </mat-form-field>

<div class="form-actions">
        <button type="button" class="btn-ghost" (click)="router.navigate(['/resumes', resumeId])">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="!loading">Save Changes</span>
          <span *ngIf="loading">Saving…</span>
        </button>
      </div>
    </form>
  </div>

</div>

<app-loading-spinner [isLoading]="loading" />
