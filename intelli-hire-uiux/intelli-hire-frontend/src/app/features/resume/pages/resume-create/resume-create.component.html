<div class="page-container">

  <!-- Back -->
  <button class="back-btn" (click)="router.navigate(['/resumes'])">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Quay lại danh sách hồ sơ
  </button>

  <!-- Form Card -->
  <div class="form-card card">
    <div class="form-header">
      <div class="form-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>
      <div>
        <h2>Tạo hồ sơ mới</h2>
        <p class="form-subtitle">Thêm hồ sơ mới vào thư viện của bạn</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">
      <div class="field-group full-width">
        <label class="field-label" for="resume-title">Tiêu đề hồ sơ <span class="required-star">*</span></label>
        <div class="input-wrap" [class.has-error]="title.touched && title.invalid">
          <span class="field-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h10"></path>
            </svg>
          </span>
          <input id="resume-title" class="field-input" formControlName="title" placeholder="VD: Senior Frontend Engineer - 2025">
        </div>
        <span class="field-error" *ngIf="title.touched && title.hasError('required')">Vui lòng nhập tiêu đề</span>
        <span class="field-error" *ngIf="title.touched && title.hasError('minlength')">Tiêu đề phải có ít nhất 3 ký tự</span>
        <span class="field-error" *ngIf="title.touched && title.hasError('maxlength')">Tiêu đề không được vượt quá 200 ký tự</span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-ghost" (click)="router.navigate(['/resumes'])">Hủy</button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="!loading">Tạo hồ sơ</span>
          <span *ngIf="loading">Đang tạo…</span>
        </button>
      </div>
    </form>
  </div>

</div>

<app-loading-spinner [isLoading]="loading" />
