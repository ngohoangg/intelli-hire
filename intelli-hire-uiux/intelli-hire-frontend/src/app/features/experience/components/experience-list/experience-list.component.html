<div class="exp-list-wrapper">

  <div class="list-header">
    <h3 class="section-title">Kinh nghiệm làm việc</h3>
    <button class="add-btn" (click)="openCreate()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Thêm kinh nghiệm
    </button>
  </div>

  <div class="loading-row" *ngIf="loading">
    <div class="skeleton" *ngFor="let i of [1,2,3]"></div>
  </div>

  <div class="empty-state" *ngIf="!loading && experiences.length === 0">
    <div class="empty-icon">💼</div>
    <p>Chưa có kinh nghiệm làm việc.</p>
    <button class="add-btn" (click)="openCreate()">Thêm kinh nghiệm đầu tiên</button>
  </div>

  <mat-accordion class="exp-accordion" *ngIf="!loading && experiences.length > 0">
    <mat-expansion-panel *ngFor="let exp of experiences" class="exp-panel">

      <mat-expansion-panel-header>
        <mat-panel-title>
          <div class="panel-title">
            <div class="title-main">
              <span class="job-title">{{ exp.title }}</span>
              <span *ngIf="exp.is_current" class="current-badge">Hiện tại</span>
            </div>
            <span class="company">{{ exp.company }}</span>
          </div>
        </mat-panel-title>
        <mat-panel-description>
          <span class="date-range">{{ formatDateRange(exp) }}</span>
        </mat-panel-description>
      </mat-expansion-panel-header>

      <div class="panel-body">
        <p class="description" *ngIf="exp.description">{{ exp.description }}</p>
        <p class="no-desc" *ngIf="!exp.description">Chưa có mô tả.</p>

        <div class="panel-actions">
          <button class="icon-btn" (click)="openEdit(exp); $event.stopPropagation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Chỉnh sửa
          </button>
          <button class="icon-btn danger" (click)="delete(exp); $event.stopPropagation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
            Xóa
          </button>
        </div>
      </div>

    </mat-expansion-panel>
  </mat-accordion>

</div>
