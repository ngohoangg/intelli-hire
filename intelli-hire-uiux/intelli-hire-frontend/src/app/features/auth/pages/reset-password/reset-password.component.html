<div class="auth-page">
  <h1>{{ 'auth.resetPassword.title' | translate }}</h1>
  <p class="subtitle">{{ 'auth.resetPassword.subtitle' | translate }}</p>

  <div class="error-banner" *ngIf="error">{{ error }}</div>
  <div class="error-banner" *ngIf="errorKey">{{ errorKey | translate }}</div>
  <div class="success-banner" *ngIf="success">
    {{ success }} <a routerLink="/auth/login">{{ 'auth.resetPassword.signIn' | translate }}</a>
  </div>

  <form *ngIf="!success && !error && !errorKey" [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field-group">
      <label class="field-label">{{ 'auth.resetPassword.newPasswordLabel' | translate }}</label>
      <input class="field-input" formControlName="newPassword" type="password" [placeholder]="'auth.resetPassword.newPasswordPlaceholder' | translate" autocomplete="new-password" />
    </div>
    <button class="btn-primary full-width" type="submit" [disabled]="loading">
      {{ loading ? ('auth.resetPassword.submitting' | translate) : ('auth.resetPassword.submit' | translate) }}
    </button>
  </form>
</div>
