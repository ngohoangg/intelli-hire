<div class="auth-page">
  <h1>Đặt lại mật khẩu</h1>
  <p class="subtitle">Nhập mật khẩu mới của bạn</p>

  <div class="error-banner" *ngIf="error">{{ error }}</div>
  <div class="success-banner" *ngIf="success">
    {{ success }} <a routerLink="/auth/login">Đăng nhập</a>
  </div>

  <form *ngIf="!success && !error" [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field-group">
      <label class="field-label">Mật khẩu mới</label>
      <input class="field-input" formControlName="newPassword" type="password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" />
    </div>
    <button class="btn-primary full-width" type="submit" [disabled]="loading">
      {{ loading ? 'Đang đặt lại...' : 'Đặt lại mật khẩu' }}
    </button>
  </form>
</div>
