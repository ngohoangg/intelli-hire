<div class="auth-page">
  <h1>Reset Password</h1>
  <p class="subtitle">Enter your new password</p>

  <div class="error-banner" *ngIf="error">{{ error }}</div>
  <div class="success-banner" *ngIf="success">
    {{ success }} <a routerLink="/auth/login">Sign In</a>
  </div>

  <form *ngIf="!success && !error" [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field-group">
      <label class="field-label">New Password</label>
      <input class="field-input" formControlName="newPassword" type="password" placeholder="Min 8 characters" autocomplete="new-password" />
    </div>
    <button class="btn-primary full-width" type="submit" [disabled]="loading">
      {{ loading ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>
</div>
