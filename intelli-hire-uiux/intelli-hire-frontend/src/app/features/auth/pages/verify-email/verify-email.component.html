<div class="auth-page">
  <h1>Xác minh email</h1>

  <div class="status-block" *ngIf="status === 'loading'">
    <div class="spinner"></div>
    <p>Đang xác minh email của bạn...</p>
  </div>

  <div class="success-banner" *ngIf="status === 'success'">{{ message }}</div>
  <div class="error-banner" *ngIf="status === 'error'">{{ message }}</div>

  <p class="auth-link" *ngIf="status !== 'loading'">
    <a routerLink="/auth/login">Quay lại đăng nhập</a>
  </p>
</div>
