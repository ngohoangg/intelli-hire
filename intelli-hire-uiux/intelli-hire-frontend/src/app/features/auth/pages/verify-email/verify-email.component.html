<div class="auth-page">
  <h1>{{ 'auth.verifyEmail.title' | translate }}</h1>

  <div class="status-block" *ngIf="status === 'loading'">
    <div class="spinner"></div>
    <p>{{ 'auth.verifyEmail.verifying' | translate }}</p>
  </div>

  <div class="success-banner" *ngIf="status === 'success'">{{ message }}</div>
  <div class="error-banner" *ngIf="status === 'error'">{{ messageKey ? (messageKey | translate) : message }}</div>

  <p class="auth-link" *ngIf="status !== 'loading'">
    <a routerLink="/auth/login">{{ 'auth.verifyEmail.backToSignIn' | translate }}</a>
  </p>
</div>
