<div class="auth-page">
  <h1>{{ 'auth.oauthCallback.title' | translate }}</h1>

  <div class="status-block" *ngIf="!error && !errorKey">
    <div class="spinner"></div>
    <p>{{ 'auth.oauthCallback.completing' | translate }}</p>
  </div>

  <div class="error-banner" *ngIf="error">{{ error }}</div>
  <div class="error-banner" *ngIf="errorKey">{{ errorKey | translate }}</div>
</div>
