<div class="auth-page">
  <h1>Forgot Password</h1>
  <p class="subtitle">Enter your email to receive a reset link</p>

  <div class="error-banner" *ngIf="error">{{ error }}</div>
  <div class="success-banner" *ngIf="success">{{ success }}</div>

  <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field-group">
      <label class="field-label">Email</label>
      <input class="field-input" formControlName="email" type="email" placeholder="you@example.com" />
    </div>
    <button class="btn-primary full-width" type="submit" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send Reset Link' }}
    </button>
  </form>

  <p class="auth-link"><a routerLink="/auth/login">Back to Sign In</a></p>
</div>
