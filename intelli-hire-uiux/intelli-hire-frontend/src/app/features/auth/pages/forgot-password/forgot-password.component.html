<div class="auth-page">
  <h1>{{ 'auth.forgotPassword.title' | translate }}</h1>
  <p class="subtitle">{{ 'auth.forgotPassword.subtitle' | translate }}</p>

  <div class="error-banner" *ngIf="error">{{ error }}</div>
  <div class="success-banner" *ngIf="success">{{ success }}</div>

  <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field-group">
      <label class="field-label">{{ 'auth.forgotPassword.emailLabel' | translate }}</label>
      <input class="field-input" formControlName="email" type="email" [placeholder]="'auth.forgotPassword.emailPlaceholder' | translate" />
    </div>
    <button class="btn-primary full-width" type="submit" [disabled]="loading">
      {{ loading ? ('auth.forgotPassword.submitting' | translate) : ('auth.forgotPassword.submit' | translate) }}
    </button>
  </form>

  <p class="auth-link"><a routerLink="/auth/login">{{ 'auth.forgotPassword.backToSignIn' | translate }}</a></p>
</div>
