<div class="auth-page">
  <h1>{{ 'auth.login.title' | translate }}</h1>
  <p class="subtitle">{{ 'auth.login.subtitle' | translate }}</p>

  <div class="error-banner" *ngIf="error">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field-group">
      <label class="field-label">{{ 'auth.login.identifierLabel' | translate }}</label>
      <input class="field-input" formControlName="identifier" [placeholder]="'auth.login.identifierPlaceholder' | translate" autocomplete="username" />
    </div>

    <div class="field-group">
      <label class="field-label">{{ 'auth.login.passwordLabel' | translate }}</label>
      <input class="field-input" formControlName="password" type="password" [placeholder]="'auth.login.passwordPlaceholder' | translate" autocomplete="current-password" />
      <a class="forgot-link" routerLink="/auth/forgot-password">{{ 'auth.login.forgotPasswordLink' | translate }}</a>
    </div>

    <button class="btn-primary full-width" type="submit" [disabled]="loading">
      <span *ngIf="!loading">{{ 'auth.login.submit' | translate }}</span>
      <span *ngIf="loading">{{ 'auth.login.submitting' | translate }}</span>
    </button>
  </form>

  <div class="oauth-divider" *ngIf="oauthProviders.length > 0">
    <span>{{ 'auth.login.oauthDivider' | translate }}</span>
  </div>

  <div class="oauth-buttons" *ngIf="oauthProviders.length > 0">
    <button class="btn-oauth" *ngFor="let p of oauthProviders" (click)="loginWithOAuth(p.code)">
      <img *ngIf="p.icon_url" [src]="p.icon_url" [alt]="p.name" width="18" height="18" />
      {{ p.name }}
    </button>
  </div>

  <p class="auth-link">{{ 'auth.login.noAccount' | translate }} <a routerLink="/auth/register">{{ 'auth.login.createOne' | translate }}</a></p>
</div>
