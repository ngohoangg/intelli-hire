<div class="auth-page">
  <h1>Sign In</h1>
  <p class="subtitle">Access your IntelliHire workspace</p>

  <div class="error-banner" *ngIf="error">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field-group">
      <label class="field-label">Email or Username</label>
      <input class="field-input" formControlName="identifier" placeholder="you@example.com" autocomplete="username" />
    </div>

    <div class="field-group">
      <label class="field-label">Password</label>
      <input class="field-input" formControlName="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <a class="forgot-link" routerLink="/auth/forgot-password">Forgot password?</a>
    </div>

    <button class="btn-primary full-width" type="submit" [disabled]="loading">
      <span *ngIf="!loading">Sign In</span>
      <span *ngIf="loading">Authenticating...</span>
    </button>
  </form>

  <div class="oauth-divider" *ngIf="oauthProviders.length > 0">
    <span>or continue with</span>
  </div>

  <div class="oauth-buttons" *ngIf="oauthProviders.length > 0">
    <button class="btn-oauth" *ngFor="let p of oauthProviders" (click)="loginWithOAuth(p.code)">
      <img *ngIf="p.icon_url" [src]="p.icon_url" [alt]="p.name" width="18" height="18" />
      {{ p.name }}
    </button>
  </div>

  <p class="auth-link">No account? <a routerLink="/auth/register">Create one</a></p>
</div>
