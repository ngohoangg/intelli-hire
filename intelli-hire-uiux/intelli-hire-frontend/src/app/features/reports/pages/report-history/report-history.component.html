<div class="page-container">

  <!-- Back -->
  <button class="back-btn" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Quay lại bảng điều khiển
  </button>

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <span class="ai-dot"></span>
      <h1>Lịch sử báo cáo</h1>
      <span class="count-badge" *ngIf="totalElements > 0">{{ totalElements }}</span>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-row">
    <button *ngFor="let f of filters"
            class="filter-btn"
            [class.active]="(f === 'ALL' && !activeFilter) || f === activeFilter"
            (click)="onFilterChange(f)">
      {{ getFilterLabel(f) }}
    </button>
  </div>

  <!-- Table Card -->
  <div class="card table-card">
    <table mat-table [dataSource]="reports" class="ih-table">

      <!-- Topic Column -->
      <ng-container matColumnDef="topic">
        <th mat-header-cell *matHeaderCellDef>Chủ đề</th>
        <td mat-cell *matCellDef="let r">
          <div class="title-cell">
            <div class="report-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
            </div>
            <span class="title-text">{{ r.topic || 'Chưa đặt tên' }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Score Column -->
      <ng-container matColumnDef="score">
        <th mat-header-cell *matHeaderCellDef>Điểm</th>
        <td mat-cell *matCellDef="let r">
          <span class="score-text">{{ getScoreText(r) }}</span>
          <span class="score-percent">{{ getScorePercent(r) }}</span>
        </td>
      </ng-container>

      <!-- Questions Column -->
      <ng-container matColumnDef="totalQuestions">
        <th mat-header-cell *matHeaderCellDef>Số câu hỏi</th>
        <td mat-cell *matCellDef="let r">{{ r.total_questions ?? 0 }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Trạng thái</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [ngClass]="getStatusClass(r.status)">
            <span class="dot" *ngIf="r.status === ReportStatus.PENDING"></span>
            {{ getStatusLabel(r.status) }}
          </span>
        </td>
      </ng-container>

      <!-- Created Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Ngày tạo</th>
        <td mat-cell *matCellDef="let r" class="date-cell">{{ r.created_at | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions-cell" (click)="$event.stopPropagation()">
          <button class="action-btn view-btn" (click)="openReport(r)" title="Xem báo cáo">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <button class="action-btn delete-btn" (click)="deleteReport(r, $event)" title="Xóa báo cáo">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="table-row"
          (click)="openReport(row)">
      </tr>

      <!-- Empty state -->
      <tr class="mat-row empty-row" *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <p>Không tìm thấy báo cáo nào.</p>
          </div>
        </td>
      </tr>
    </table>

    <mat-paginator
      *ngIf="totalElements > 0"
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)" />
  </div>

</div>

<app-loading-spinner [isLoading]="loading" />
