<div class="page-container">
  <div class="page-header">
    <div class="page-title">
      <span class="ai-dot"></span>
      <h1>{{ 'account.profile.pageTitle' | translate }}</h1>
    </div>
  </div>

  <app-loading-spinner [isLoading]="loading" />

  <div class="card settings-card" *ngIf="!loading">
    <div class="error-banner" *ngIf="error">{{ error }}</div>
    <div class="success-banner" *ngIf="success">{{ success }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="settings-form">
      <div class="form-section">
        <span class="section-label">{{ 'account.profile.personalInfoSection' | translate }}</span>
        <div class="field-row-3">
          <div class="field-group"><label class="field-label">{{ 'account.profile.firstName' | translate }}</label><input class="field-input" formControlName="firstName" /></div>
          <div class="field-group"><label class="field-label">{{ 'account.profile.middleName' | translate }}</label><input class="field-input" formControlName="middleName" /></div>
          <div class="field-group"><label class="field-label">{{ 'account.profile.lastName' | translate }}</label><input class="field-input" formControlName="lastName" /></div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">{{ 'account.profile.phone' | translate }}</label>
            <input class="field-input" formControlName="phone"
              [class.field-input--error]="form.get('phone')?.invalid && form.get('phone')?.dirty"
              [placeholder]="'account.profile.phonePlaceholder' | translate" />
            <span class="field-error" *ngIf="form.get('phone')?.hasError('pattern') && form.get('phone')?.dirty">
              {{ 'account.profile.phoneError' | translate }}
            </span>
          </div>
          <div class="field-group"><label class="field-label">{{ 'account.profile.dateOfBirth' | translate }}</label><input class="field-input" formControlName="birthOfDate" type="date" /></div>
          <div class="field-group">
            <label class="field-label">{{ 'account.profile.gender' | translate }}</label>
            <select class="field-select" formControlName="gender">
              <option value="">{{ 'account.profile.genderPlaceholder' | translate }}</option>
              <option value="MALE">{{ 'account.profile.genderMale' | translate }}</option>
              <option value="FEMALE">{{ 'account.profile.genderFemale' | translate }}</option>
              <option value="OTHER">{{ 'account.profile.genderOther' | translate }}</option>
              <option value="PREFER_NOT_TO_SAY">{{ 'account.profile.genderPreferNotToSay' | translate }}</option>
            </select>
          </div>
        </div>
        <div class="field-group"><label class="field-label">{{ 'account.profile.address' | translate }}</label><input class="field-input" formControlName="address" /></div>
      </div>

      <div class="form-section" *ngIf="!auth.isAdmin">
        <span class="section-label">{{ 'account.profile.socialLinksSection' | translate }}</span>
        <div class="field-row">
          <div class="field-group"><label class="field-label">{{ 'account.profile.githubUrl' | translate }}</label><input class="field-input" formControlName="githubUrl" [placeholder]="'account.profile.githubUrlPlaceholder' | translate" /></div>
          <div class="field-group"><label class="field-label">{{ 'account.profile.linkedInUrl' | translate }}</label><input class="field-input" formControlName="linkedInUrl" [placeholder]="'account.profile.linkedInUrlPlaceholder' | translate" /></div>
        </div>
        <div class="field-group"><label class="field-label">{{ 'account.profile.avatarUrl' | translate }}</label><input class="field-input" formControlName="avatarUrl" [placeholder]="'account.profile.avatarUrlPlaceholder' | translate" /></div>
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit" [disabled]="saving || form.invalid">
          {{ saving ? ('account.profile.saving' | translate) : ('account.profile.saveChanges' | translate) }}
        </button>
      </div>
    </form>
  </div>
</div>
