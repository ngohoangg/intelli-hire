<div class="page-container">
  <div class="page-header">
    <div class="page-title">
      <span class="ai-dot"></span>
      <h1>Profile Settings</h1>
    </div>
  </div>

  <app-loading-spinner [isLoading]="loading" />

  <div class="card settings-card" *ngIf="!loading">
    <div class="error-banner" *ngIf="error">{{ error }}</div>
    <div class="success-banner" *ngIf="success">{{ success }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="settings-form">
      <div class="form-section">
        <span class="section-label">Personal Info</span>
        <div class="field-row-3">
          <div class="field-group"><label class="field-label">First Name</label><input class="field-input" formControlName="firstName" /></div>
          <div class="field-group"><label class="field-label">Middle Name</label><input class="field-input" formControlName="middleName" /></div>
          <div class="field-group"><label class="field-label">Last Name</label><input class="field-input" formControlName="lastName" /></div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Phone</label>
            <input class="field-input" formControlName="phone"
              [class.field-input--error]="form.get('phone')?.invalid && form.get('phone')?.dirty"
              placeholder="+84901234567" />
            <span class="field-error" *ngIf="form.get('phone')?.hasError('pattern') && form.get('phone')?.dirty">
              Only digits allowed; if using country code, start with +
            </span>
          </div>
          <div class="field-group"><label class="field-label">Date of Birth</label><input class="field-input" formControlName="birthOfDate" type="date" /></div>
          <div class="field-group">
            <label class="field-label">Gender</label>
            <select class="field-select" formControlName="gender">
              <option value="">-- Select --</option>
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
              <option value="PREFER_NOT_TO_SAY">Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="field-group"><label class="field-label">Address</label><input class="field-input" formControlName="address" /></div>
      </div>

      <div class="form-section" *ngIf="!auth.isAdmin">
        <span class="section-label">Social Links</span>
        <div class="field-row">
          <div class="field-group"><label class="field-label">GitHub URL</label><input class="field-input" formControlName="githubUrl" placeholder="https://github.com/..." /></div>
          <div class="field-group"><label class="field-label">LinkedIn URL</label><input class="field-input" formControlName="linkedInUrl" placeholder="https://linkedin.com/in/..." /></div>
        </div>
        <div class="field-group"><label class="field-label">Avatar URL</label><input class="field-input" formControlName="avatarUrl" placeholder="https://..." /></div>
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit" [disabled]="saving || form.invalid">
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
