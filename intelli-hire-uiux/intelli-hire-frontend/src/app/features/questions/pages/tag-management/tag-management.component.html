<div class="page-container">
  <button class="back-btn" routerLink="/questions">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    Back
  </button>

  <div class="page-header">
    <div class="page-title-group">
      <div class="page-title">
        <span class="ai-dot"></span>
        <h1>Tags</h1>
        <span class="count-badge">{{ tags.length }}</span>
      </div>
      <p class="page-subtitle">
        Manage reusable labels that power search, random generation and targeted question curation.
      </p>
    </div>

    <div class="header-actions">
      <button class="btn-ghost" type="button" (click)="startCreate()">New Tag</button>
    </div>
  </div>

  <div class="split-layout">
    <section class="card section-card">
      <div class="section-header">
        <div class="section-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
            <path d="M20.59 13.41L11 3.83a2 2 0 0 0-1.41-.59H4a2 2 0 0 0-2 2v5.59a2 2 0 0 0 .59 1.41L12.17 22a2 2 0 0 0 2.83 0l5.59-5.59a2 2 0 0 0 0-2.83z"></path>
            <line x1="7" y1="7" x2="7.01" y2="7"></line>
          </svg>
          <h2 class="section-title">Tag Library</h2>
        </div>
      </div>

      <div class="chip-list large-list" *ngIf="tags.length; else emptyState">
        <button
          *ngFor="let tag of tags"
          type="button"
          class="tag-card"
          [class.selected]="selectedTag?.id === tag.id"
          (click)="selectTag(tag)">
          <span class="chip chip-accent">{{ tag.name }}</span>
          <span class="table-secondary">Reusable filter label</span>
          <span class="text-action danger" (click)="deleteTag(tag, $event)">Delete</span>
        </button>
      </div>

      <ng-template #emptyState>
        <div class="empty-panel compact">
          <h3>No tags yet</h3>
          <p>Create the first reusable tag to improve question segmentation.</p>
        </div>
      </ng-template>
    </section>

    <aside class="side-panel">
      <div class="section-header">
        <div class="section-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--magenta)" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M12 4h9"></path>
            <path d="M4 9h16"></path>
            <path d="M4 15h16"></path>
          </svg>
          <h2 class="section-title">{{ selectedTag ? 'Edit Tag' : 'Create Tag' }}</h2>
        </div>
      </div>

      <form [formGroup]="form" class="stack-list">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="spring-core" />
        </mat-form-field>

        <div class="editor-actions">
          <button class="btn-ghost" type="button" (click)="startCreate()">Reset</button>
          <button class="btn-primary" type="button" (click)="submit()">
            {{ selectedTag ? 'Save Tag' : 'Create Tag' }}
          </button>
        </div>
      </form>

      <div class="divider"></div>

      <button class="text-action" type="button" [disabled]="!selectedTag" (click)="openQuestionBank()">
        Open question bank with this tag
      </button>
    </aside>
  </div>
</div>

<app-loading-spinner [isLoading]="loading || saving" />
