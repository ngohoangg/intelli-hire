<div class="file-tab">

  <!-- Existing file card -->
  <div class="file-card" *ngIf="existingFile && !uploading">
    <div class="file-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
      </svg>
    </div>
    <div class="file-info">
      <span class="file-name">{{ existingFile.original_name }}</span>
      <span class="file-meta">{{ formatBytes(existingFile.file_size_bytes) }} · Uploaded {{ formatDate(existingFile.created_at) }}</span>
    </div>
    <div class="file-actions">
      <button class="action-btn" (click)="download()" title="Download">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download
      </button>
      <button class="action-btn danger" (click)="deleteFile()" title="Delete">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        </svg>
        Delete
      </button>
    </div>
  </div>

  <!-- Parse job status -->
  <app-parse-job-status *ngIf="activeJobId" [jobId]="activeJobId" />

  <!-- Upload progress bar -->
  <div class="upload-progress" *ngIf="uploading">
    <span class="upload-label">Uploading…</span>
    <mat-progress-bar mode="determinate" [value]="uploadProgress ?? 0" />
    <span class="upload-percent">{{ uploadProgress }}%</span>
  </div>

  <!-- Drop zone (shown when no file or to replace) -->
  <div *ngIf="!existingFile && !uploading"
    class="drop-zone"
    [class.drag-over]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)">
    <div class="drop-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <p class="drop-title">Drag & drop your CV here</p>
    <p class="drop-subtitle">PDF or DOCX · Max 5 MB</p>
    <label class="upload-btn">
      Browse File
      <input type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        (change)="onFileSelected($event)" hidden>
    </label>
  </div>

</div>
