<div class="page-container">
  <div class="page-header">
    <div class="page-title">
      <span class="ai-dot"></span>
      <h1>Tài khoản</h1>
      <span class="count-badge" *ngIf="totalElements > 0">{{ totalElements }}</span>
    </div>
  </div>

  <div class="filter-bar">
    <input class="search-input" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Tìm theo email hoặc tên đăng nhập..." />
    <select class="filter-select" [(ngModel)]="statusFilter" (change)="onSearch()">
      <option value="">Tất cả trạng thái</option>
      <option value="ACTIVE">Hoạt động</option>
      <option value="INACTIVE">Không hoạt động</option>
      <option value="LOCKED">Đã khóa</option>
    </select>
  </div>

  <div class="card table-card">
    <table class="ih-table">
      <thead>
        <tr>
          <th>Tài khoản</th>
          <th>Trạng thái</th>
          <th>Đăng nhập gần nhất</th>
          <th>Ngày tạo</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr class="table-row" *ngFor="let a of accounts" (click)="router.navigate(['/admin/accounts', a.id])">
          <td>
            <div class="account-cell">
              <span class="account-username">{{ a.username }}</span>
              <span class="account-email">{{ a.email }}</span>
            </div>
          </td>
          <td><span class="status-badge" [class]="'status-' + a.status.toLowerCase()">{{ statusLabel(a.status) }}</span></td>
          <td class="date-cell">{{ formatDate(a.last_login_at) }}</td>
          <td class="date-cell">{{ formatDate(a.created_at) }}</td>
          <td class="actions-cell" (click)="$event.stopPropagation()">
            <ng-container *ngIf="!a.is_super_admin; else protectedCell">
              <button class="action-btn" (click)="updateStatus(a, 'ACTIVE')" *ngIf="a.status !== 'ACTIVE'" title="Kích hoạt">✓</button>
              <button class="action-btn lock-btn" (click)="updateStatus(a, 'LOCKED')" *ngIf="a.status !== 'LOCKED'" title="Khóa">⚿</button>
            </ng-container>
            <ng-template #protectedCell>
              <span class="super-admin-lock" title="Super Admin — được bảo vệ">⚑</span>
            </ng-template>
          </td>
        </tr>
        <tr *ngIf="accounts.length === 0 && !loading">
          <td colspan="5">
            <div class="empty-state"><p>Không tìm thấy tài khoản nào.</p></div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" *ngIf="totalElements > size">
      <button class="page-btn" (click)="prevPage()" [disabled]="page === 0">← Trước</button>
      <span class="page-info">Trang {{ page + 1 }} / {{ Math.ceil(totalElements / size) }}</span>
      <button class="page-btn" (click)="nextPage()" [disabled]="(page + 1) * size >= totalElements">Sau →</button>
    </div>
  </div>

  <app-loading-spinner [isLoading]="loading" />
</div>
