spring:
  application:
    name: intellihireresume
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:}:${DB_PORT:}/${DATABASE_NAME:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: IntelliHireQuestionHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_resume
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    clean-disabled: true
  
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      timeout: 2000
      connect-timeout: 2000

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

minio:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:}

logging:
  level:
    org:
      aibles:
        intellihireresume: ${LOG_LEVEL:INFO}
      hibernate:
        SQL: ${SQL_LOG_LEVEL:WARN}
        type:
          descriptor:
            sql:
              BasicBinder: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] [%X{userId}] %-5level %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

ai:
  provider: ${AI_PROVIDER:openai}          # openai | claude | gemini | grok | openrouter
  max-retries: ${AI_MAX_RETRIES:3}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT:60}
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}
    timeout-seconds: ${AI_TIMEOUT:60}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    timeout-seconds: ${AI_TIMEOUT:60}
  grok:
    api-key: ${GROK_API_KEY:}
    model: ${GROK_MODEL:grok-3}
    timeout-seconds: ${AI_TIMEOUT:60}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:x-ai/grok-4.1-fast}
    timeout-seconds: ${AI_TIMEOUT:120}
    site-url: ${OPENROUTER_SITE_URL:https://intellihire.dev}
    site-name: ${OPENROUTER_SITE_NAME:IntelliHire}
