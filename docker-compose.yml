services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-intellihire}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes: [miniodata:/data]

  eureka:
    build: ./intelli-hire-eureka-service
    ports: ["8761:8761"]

  gateway:
    build: ./intelli-hire-gateway
    env_file: .env
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://eureka:8761/eureka
      REDIS_HOST: redis
    depends_on: [eureka, redis]

  auth:
    build: ./intelli-hire-auth
    env_file: .env
    environment: &svc-env
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:29092
      EUREKA_URL: http://eureka:8761/eureka
      SPRING_PROFILES_ACTIVE: prod
      DB_SCHEMA: auth
    depends_on: &svc-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      eureka: { condition: service_started }

  question:
    build: ./intelli-hire-question
    env_file: .env
    environment:
      <<: *svc-env
      DB_SCHEMA: question
      RESUME_SERVICE_URL: http://resume:8082
    depends_on: *svc-deps

  resume:
    build: ./intelli-hire-resume
    env_file: .env
    environment:
      <<: *svc-env
      DB_SCHEMA: resume
      MINIO_ENDPOINT: http://minio:9000
    depends_on: *svc-deps

  interviews:
    build: ./intelli-hire-interviews
    env_file: .env
    environment:
      <<: *svc-env
      DB_SCHEMA: interviews
      QUESTION_SERVICE_URL: http://question:8081
    depends_on: *svc-deps

  grading:
    build: ./intelli-hire-grading
    env_file: .env
    environment:
      <<: *svc-env
      DB_SCHEMA: grading
      INTERVIEW_SERVICE_URL: http://interviews:8083
      QUESTION_SERVICE_URL: http://question:8081
    depends_on: *svc-deps

  report:
    build: ./intelli-hire-report
    env_file: .env
    environment:
      <<: *svc-env
      DB_SCHEMA: report
    depends_on: *svc-deps

volumes:
  pgdata:
  miniodata:
