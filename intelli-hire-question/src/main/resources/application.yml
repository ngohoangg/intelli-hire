spring:
  application:
    name: intelli-hire-question

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DATABASE_NAME}?currentSchema=${DB_SCHEMA:question}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: IntelliHireQuestionHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:question}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:question}
    default-schema: ${DB_SCHEMA:question}
    table: flyway_schema_history_question
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    org.aibles: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

clients:
  resume:
    base-url: ${RESUME_SERVICE_BASE_URL:http://localhost:8082}
    timeout-seconds: ${RESUME_SERVICE_TIMEOUT:30}
    question-context-path: ${RESUME_QUESTION_CONTEXT_PATH:/api/v1/resumes/{resumeId}/profile}

ai:
  provider: ${AI_PROVIDER:openrouter}
  output-language: ${AI_OUTPUT_LANGUAGE:Vietnamese}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:x-ai/grok-4.1-fast}
    timeout-seconds: ${AI_TIMEOUT:60}
    site-url: ${OPENROUTER_SITE_URL:https://intellihire.dev}
    site-name: ${OPENROUTER_SITE_NAME:IntelliHire}
