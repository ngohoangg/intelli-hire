spring:
  application:
    name: intelli-hire-grading

  profiles:
    active: local

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: IntelliHireGradingHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: grading-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: org.aibles.intellihiregrading.dto.kafka.SessionCompletedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: ${CONTEXT_PATH:/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    org.aibles: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# OpenRouter LLM config
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  model: ${OPENROUTER_MODEL:x-ai/grok-4.1-fast}
  temperature: ${OPENROUTER_TEMPERATURE:0.3}
  max-tokens: ${OPENROUTER_MAX_TOKENS:1024}
  timeout: ${OPENROUTER_TIMEOUT:30000}

# Interview Service client
interview-service:
  base-url: ${INTERVIEW_SERVICE_URL:http://localhost:8083}

# Report Service client
report-service:
  base-url: ${REPORT_SERVICE_URL:http://localhost:8085/api}

# Kafka topics
kafka:
  topics:
    session-completed: ${KAFKA_TOPIC_SESSION_COMPLETED:session_completed}
    grading-completed: ${KAFKA_TOPIC_GRADING_COMPLETED:grading_completed}

# Async thread pool for parallel LLM calls
grading:
  thread-pool:
    core-size: ${GRADING_POOL_CORE:10}
    max-size: ${GRADING_POOL_MAX:20}
    queue-capacity: ${GRADING_POOL_QUEUE:100}
