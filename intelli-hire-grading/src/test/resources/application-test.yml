spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  cache:
    type: simple
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 0

logging:
  level:
    root: WARN
    org.aibles: DEBUG

openrouter:
  api-key: test-key
  base-url: http://localhost:8888
  model: test-model
  temperature: 0.3
  max-tokens: 1024
  timeout: 5000

interview-service:
  base-url: http://localhost:9998

report-service:
  base-url: http://localhost:9999

kafka:
  topics:
    session-completed: test_session_completed
    grading-completed: test_grading_completed

grading:
  thread-pool:
    core-size: 2
    max-size: 4
    queue-capacity: 10
