server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: interview-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intellihire}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: interview-service-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:interviews}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:interviews}
    default-schema: ${DB_SCHEMA:interviews}
    table: flyway_schema_history_interviews
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{requestId:-}] [%X{userId:-}]"

application:
  clients:
    question-service-url: ${QUESTION_SERVICE_URL:http://localhost:8081}
  kafka:
    topics:
      session-completed: ${KAFKA_TOPIC_SESSION_COMPLETED:session_completed}
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:4200}
  session:
    max-duration-minutes: 60
